# Render blueprint for the ReviewLens API service and its database.
# The Next.js frontend is deployed separately on Vercel and talks to this
# service via NEXT_PUBLIC_API_BASE_URL.
#
# NOTE: Render deletes free Postgres instances 30 days after creation. When that
# happens, create a new one, update DATABASE_URL, and the schema is recreated on
# the first request — but stored runs are lost. Upgrade the database to a paid
# tier to keep them.
databases:
  - name: reviewlens-db
    databaseName: reviewlens
    user: reviewlens
    plan: free

services:
  - type: web
    name: reviewlens-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run start:server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: reviewlens-db
          property: connectionString
      # Comma-separated frontend origins. Add the Vercel production domain here;
      # "*.vercel.app" additionally allows preview deployments.
      - key: CORS_ORIGINS
        sync: false
      # Groq API key for live classification.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
